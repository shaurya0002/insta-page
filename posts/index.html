<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!--NAV-->
    <nav class="sidebar">
    <div class="insta-logo">
        <img src="" alt="Instagram Logo">
    </div>
    
    <ul class="nav-links">
        <li><a href="#"><img src="" alt="Home"></a></li>
        <li><a href="#"><img src="" alt="Reel"></a></li>
        <li><a href="#"><img src="" alt="Messages"><span class="badge">9+</span></a></li>
        <li><a href="#"><img src="" alt="Search"></a></li>
        <li><a href="#"><img src="" alt="Notifications"><span class="badge-dot"></span></a></li>
        <li><a href="#"><img src="" alt="Create"></a></li>
    </ul>

    <div class="profile-icon">
        <img src="" alt="Your Profile">
    </div>

    <a href="#" class="more-menu">More</a>
    </nav>


    <!--Main-->

    <main class="main-content">
        <header class="profile-header">
        <div class="avatar-wrap">
            <img class="avatar" src="" alt="profile-pic">
        </div>

        <div class="profile-info">
            <div class="username-row">
                <h1 class="username">shauinchaos</h1>
                <span class="verified-badge"></span>
            </div>

        <h2 class="display-name">Homelanduhh</h2>

        <ul class="profile-stats">
            <li><strong>0</strong> posts</li>
            <li><strong>104</strong> followers</li>
            <li><strong>153</strong> following</li>
        </ul>

        <div class="bio">
            <p>Nightmares are dreams perverted.</p>
            <span class="thread-link">shauinchaos</span>
        </div>

        <div class="action-buttons">
            <button class="editbtn">Edit profile</button>
            <button class="archivebtn">View archive</button>
        </div>
    </div>
    </header>

    <!--Highlight Section-->
    <section class="highlights">
        <div class="highlight">
            <div class="highlight-circle"></div>
            <span class="highlight-label"></span>
        </div>

        <div class="highlight">
            <div class="highlight-circle"></div>
            <span class="highlight-label">&lt;3</span>
        </div>

        <div class="highlight">
            <div class="highlight-circle">+</div>
            <span class="highlight-label">New</span>
        </div>
        </section>

    <!--Profile tabs-->
    <nav class="profile-tabs">
        <a href="#" class="tab active">
            <img src="" alt="post-grid">
        </a>

        <a href="#" class="tab">
            <img src="" alt="saved">
        </a>

        <a href="#" class="tab">
            <img src="" alt="reposts">
        </a>

        <a href="#" class="tab">
            <img src="" alt="tagged">
        </a>

    </nav>
    <!--Empty Area-->
    <section class="empty-state">
        <div class="camera-icon"></div>
        <h2>Share Photos</h2>
        <p>When you share photos, they will appear on your profile.</p>
    </section>
    </main>
    
</body>
</html>
